<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Withdraw | TITA BANK</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="container">

```
<h2>Withdraw Virtual Money</h2>

<p>Account Number: {{ user.account_number }}</p>

<h3>Available Balance</h3>

<h2>MWK {{ "%.2f"|format(user.balance) }}</h2>

{% with messages = get_flashed_messages() %}
    {% for message in messages %}
        <p>{{ message }}</p>
    {% endfor %}
{% endwith %}

<form method="POST">

    <label>Withdrawal Amount (MWK)</label>

    <input
        type="number"
        name="amount"
        min="0.01"
        step="0.01"
        placeholder="Enter withdrawal amount"
        required
    >

    <button type="submit">Withdraw Money</button>

</form>

<p><a href="/dashboard">Back to Dashboard</a></p>


</div>
<script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
